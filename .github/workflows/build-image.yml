name: Build Container Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'start-openclaw.sh'
      - 'skills/**'

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: b5ee1671e54d7c7fcf17e90b9ca7741a

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker info

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Verify Secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CF_API_TOKEN secret is not set!"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID"
          echo "Secrets are configured correctly"

      - name: Build and push image with Wrangler
        run: |
          set -e
          TAG=$(echo ${{ github.sha }} | cut -c1-7)
          echo "Building image with tag: $TAG"
          echo "Target account: $CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID="b5ee1671e54d7c7fcf17e90b9ca7741a"
          npx wrangler containers build . -t moltbot-sandbox-moltbotsandbox:$TAG -p
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "Successfully pushed image: moltbot-sandbox-moltbotsandbox:$TAG"
