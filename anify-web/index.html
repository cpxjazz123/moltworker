<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/vite.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>anify-web</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        const ua = navigator.userAgent;
        const isIPhone = /iPhone/i.test(ua);
        const isSafari = /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS/i.test(ua);
        const safariVersion = parseInt((ua.match(/Version\/(\d+)/) || [])[1] || "0", 10);
        // 仅 iPhone Safari 26+ 需要透明地址栏适配
        if (isIPhone && isSafari && safariVersion >= 26) {
          document.documentElement.classList.add("is-iphone-safari");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
